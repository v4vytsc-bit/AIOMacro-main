# Built-in Discord bot for AIO-Macro
#
# 1. Copy this file to "discord-bot.properties" (same folder) and fill in the two values.
# 2. Build the mod. Every jar you build then has the bot built in:
#    players just install the jar - no token or channel to set up.
#
# KEEP IT PRIVATE: discord-bot.properties is git-ignored so it never gets committed,
# but the token CAN be read out of any jar built with it. Only give those jars to people
# you trust and never post them publicly. If one leaks: Developer Portal > Bot > Reset Token,
# put the new token here and rebuild.

# Developer Portal > your app > Bot > Reset Token
token=

# Discord (Developer Mode on) > right-click the control channel > Copy Channel ID
channel_id=

# Activity updates (who joined/left, who started/stopped the macro).
# Discord > channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL
activity_webhook=
